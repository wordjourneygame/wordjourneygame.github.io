<style>
  :root { --bg:#0B1230; --deep:#060A1F; --surface:#162150; --outline:#2A3A7A; --text2:#A9B6E8; --gold:#FFC53D; --green:#2ED573; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Bengali", "Noto Naskh Arabic", "Noto Sans SC", sans-serif; color: #fff;
    background: radial-gradient(900px 500px at 85% -10%, rgba(47,123,255,.35), transparent 60%), linear-gradient(var(--bg), var(--deep));
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 440px; text-align: center; }
  .brand { font-family: "Lilita One", system-ui; font-size: 26px; letter-spacing: 1px; margin-bottom: 28px; direction: ltr; }
  .blocks { display: grid; grid-template-columns: repeat(3, 26px); gap: 5px; justify-content: center; margin: 0 auto 18px; direction: ltr; }
  .blocks i { width: 26px; height: 26px; border-radius: 7px; display: block; box-shadow: inset 0 6px 0 rgba(255,255,255,.25); }
  .region { color: var(--text2); font-weight: 700; font-size: 17px; min-height: 22px; unicode-bidi: plaintext; }
  h1 { font-family: "Lilita One", system-ui, sans-serif; font-weight: 400; font-size: 46px; line-height: 1.15; margin: 6px 0 14px; overflow-wrap: anywhere; unicode-bidi: plaintext; }
  .seats { display: flex; gap: 10px; justify-content: center; margin: 4px 0 14px; }
  .seats span { width: 40px; height: 40px; border-radius: 11px; background: rgba(255,255,255,.12); transition: background .3s; }
  .seats span.on { background: var(--gold); }
  .seats.open span { background: var(--green); }
  .status { font-weight: 800; font-size: 15px; display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(255,197,61,.14); color: var(--gold); }
  .status.open { background: rgba(46,213,115,.14); color: var(--green); }
  p.body { color: var(--text2); line-height: 1.6; font-size: 16px; margin: 16px 0 26px; overflow-wrap: break-word; }
  a.btn { display: block; text-decoration: none; color: #fff; font-weight: 800; font-size: 19px; line-height: 1.3; padding: 18px; border-radius: 999px; margin-bottom: 12px; overflow-wrap: break-word; }
  a.primary { background: linear-gradient(#4C8DFF, #2468F0); box-shadow: 0 10px 30px rgba(47,123,255,.45); }
  a.tonal { background: rgba(22,33,80,.85); border: 1px solid rgba(42,58,122,.8); font-size: 17px; }
  .foot { color: rgba(169,182,232,.6); font-size: 12px; margin-top: 18px; }
  html[lang="ur"] body, html[lang="fa"] body, html[lang="ar"] body { line-height: 1.7; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">BLOCK LEAGUE</div>
  <div class="blocks" aria-hidden="true">
    <i style="background:#2F7BFF"></i><i style="background:#2ED573"></i><i style="background:transparent;box-shadow:none"></i>
    <i style="background:transparent;box-shadow:none"></i><i style="background:#FFD43B"></i><i style="background:#FF8A2B"></i>
    <i style="background:#9B5CFF"></i><i style="background:#FF4757"></i><i style="background:#2F7BFF"></i>
  </div>
  <div class="region" id="region"></div>
  <h1 id="name">Your district</h1>
  <div class="seats" id="seats"><span></span><span></span><span></span></div>
  <div class="status" id="status">Founding</div>
  <p class="body" id="body">A friend invited you to help found this district. When 3 founders (a Mayor and 2 Deputy Mayors) join, its leaderboard opens for everyone — and founders keep a permanent title.</p>
  <a class="btn primary" id="play" href="https://play.google.com/store/apps/details?id=io.github.wordjourneygame.blockleague">Get Block League</a>
  <a class="btn tonal" id="open" href="#">Already installed? Open the app</a>
  <div class="foot" id="foot">Place names: GeoNames (CC BY 4.0)</div>
</main>

  var c = (q.get("c") || d.split("-")[0] || "").toUpperCase();
  var r = (q.get("r") || "").toUpperCase();
  if (!CODE.test(d)) d = "";
  if (!/^[A-Z]{2}$/.test(c)) c = "";
  if (!CODE.test(r)) r = "";

  // Play Store link carries the district in the install referrer, so the app preselects it after install.
  var ref = ["district=" + d, "c=" + c, "r=" + r, "utm_source=invite", "utm_medium=share"].join("&");
  var play = "https://play.google.com/store/apps/details?id=" + PKG + (d ? "&referrer=" + encodeURIComponent(ref) : "");
  document.getElementById("play").href = play;

  // Android: hand the same link to the app if installed, else fall back to the store.
  var path = location.host + location.pathname + location.search;
  document.getElementById("open").href = "intent://" + path + "#Intent;scheme=https;package=" + PKG +
    ";S.browser_fallback_url=" + encodeURIComponent(play) + ";end";

  function flag(cc) {
    if (cc.length !== 2) return "";
    return String.fromCodePoint(0x1F1E6 + cc.charCodeAt(0) - 65, 0x1F1E6 + cc.charCodeAt(1) - 65);
  }
  function show(info) {
    var region = info.region_name || "";
    var name = info.name || t("your_district");
    document.getElementById("region").textContent = (flag(info.country || c) + "  " + region).trim();
    document.getElementById("name").textContent = name;
    var founders = Math.max(0, Math.min(3, info.founders || 0));
    var seats = document.getElementById("seats");
    var status = document.getElementById("status");
    var body = document.getElementById("body");
    if (info.opened) {
      seats.classList.add("open");
      status.classList.add("open");
      status.textContent = t("board_open");
      body.textContent = t("open_body", { name: name });
      document.title = t("open_title", { name: name });
    } else {
      Array.prototype.forEach.call(seats.children, function (s, i) { s.classList.toggle("on", i < founders); });
      status.textContent = t("founding_status", { n: nf.format(founders), total: nf.format(3) });
      body.textContent = t("founding_body", {
        place: (region ? region + " / " : "") + name,
        seats_left: plural("seats_left", 3 - founders),
        title: t("deputy_of", { place: name })
      });
      document.title = t("founding_title", { name: name, n: nf.format(founders), total: nf.format(3) });
    }
  }

  if (!d || SUPABASE_URL.indexOf("__") === 0) return;
  fetch(SUPABASE_URL + "/rest/v1/rpc/get_district", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_district: d })
  }).then(function (res) { return res.ok ? res.json() : null; })
    .then(function (info) { if (info && !info.error) show(info); })
    .catch(function () {});
})();
</script>
</body>
</html>
